# PRs and manual runs build/test with read-only permissions. Only v* tag pushes publish.
# Bump package.json, both package-lock root versions, and src/fetch.ts before tagging.
# A hyphen in the version (for example v0.5.0-rc1) publishes a prerelease.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tooling/package-lock.json

      - name: Set scratch directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check source, manifest, lockfile and tag versions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const src = readFileSync('src/fetch.ts', 'utf8').match(/^export const VERSION = '([^']+)';$/m)?.[1];
          const versions = [pkg.version, lock.version, lock.packages?.['']?.version, src];
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            const tag = process.env.GITHUB_REF_NAME;
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(tag ?? '')) {
              throw new Error(`invalid release tag: ${tag}`);
            }
            versions.push(tag.slice(1));
          }
          if (versions.some(v => typeof v !== 'string' || v !== pkg.version)) {
            throw new Error(`package.json, package-lock.json roots, src/fetch.ts and release tag must match: ${JSON.stringify(versions)}`);
          }
          NODE

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production and bootstrap tooling dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix tooling --audit-level=high

      # Bun's npm lifecycle installer is deliberately not run. Use the native binary
      # whose package tarball/integrity is already pinned by the root npm lockfile.
      - name: Expose the lockfile-installed Bun binary
        run: |
          test -x node_modules/@oven/bun-linux-x64/bin/bun
          # npm run puts node_modules/.bin first; replace Bun's uninitialized
          # lifecycle stub, rather than adding a native binary later on PATH.
          ln -sfn ../@oven/bun-linux-x64/bin/bun node_modules/.bin/bun
          node_modules/.bin/bun --version

      - run: npm test
        env:
          WCLIP_CHROMIUM: /usr/bin/google-chrome
      - name: Test first-run source bootstrap
        run: sh test/bootstrap-smoke.sh
      - run: npm run build:bin
      - run: npm run build:js

      # Chromium is opt-in; the loopback-only smoke fixture explicitly allows private IPs.
      - name: Smoke-test the x64 binaries and Node bundle
        env:
          WCLIP_CHROMIUM: /usr/bin/google-chrome
        run: |
          sh test/binary-smoke.sh build/wclip-linux-x64
          sh test/binary-smoke.sh build/wclip-linux-x64-baseline
          node build/wclip-node.js --version

      - name: Checksums
        working-directory: build
        run: |
          sha256sum wclip-linux-x64 wclip-linux-x64-baseline wclip-linux-arm64 \
            wclip-node.js wclip-bun.js > SHA256SUMS
          sha256sum --strict --check SHA256SUMS

      - name: Upload tested release files
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wclip-release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            build/wclip-linux-x64
            build/wclip-linux-x64-baseline
            build/wclip-linux-arm64
            build/wclip-node.js
            build/wclip-bun.js
            build/SHA256SUMS

  # Private repositories require GitHub Enterprise Cloud for attestations. This
  # personal private repo cannot establish that entitlement, so skip rather than
  # break releases; public repos attest in an isolated job with no dependency code.
  attest:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: build
          merge-multiple: true
      - name: Verify downloaded release checksums
        working-directory: build
        run: sha256sum --strict --check SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/wclip-linux-x64
            build/wclip-linux-x64-baseline
            build/wclip-linux-arm64
            build/wclip-node.js
            build/wclip-bun.js

  publish:
    needs: [build, attest]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.attest.result == 'success' || needs.attest.result == 'skipped') &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Do not check out or execute repository/dependency code in this job.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: build
          merge-multiple: true
      - name: Verify downloaded release checksums
        working-directory: build
        run: sha256sum --strict --check SHA256SUMS
      - name: Publish the release
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease);; esac
          gh release create "$GITHUB_REF_NAME" "${pre[@]}" --verify-tag \
            --title "wclip $GITHUB_REF_NAME" --generate-notes \
            wclip-linux-x64 wclip-linux-x64-baseline wclip-linux-arm64 \
            wclip-node.js wclip-bun.js SHA256SUMS
