# Builds and tests wclip. On a v* tag it also publishes the binaries and bundles as a
# GitHub Release; on pull requests and manual runs it stops after the tests.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=${GITHUB_REF_NAME#v}
          pkg=$(node -p 'require("./package.json").version')
          src=$(sed -n "s/^export const VERSION = '\(.*\)';/\1/p" src/fetch.ts)
          if [ "$v" != "$pkg" ] || [ "$v" != "$src" ]; then
            echo "::error::tag $GITHUB_REF_NAME, package.json $pkg, src/fetch.ts $src must all match"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build:bin
      - run: npm run build:js

      # The runner image has Google Chrome, which covers the headless browser fallback.
      - name: Smoke-test the x64 binaries
        env:
          WCLIP_CHROMIUM: /usr/bin/google-chrome
        run: |
          sh test/binary-smoke.sh build/wclip-linux-x64
          sh test/binary-smoke.sh build/wclip-linux-x64-baseline
          node build/wclip-node.js --version

      - name: Checksums
        working-directory: build
        run: sha256sum wclip-* | tee SHA256SUMS

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease;; esac
          cd build && gh release create "$GITHUB_REF_NAME" $pre --verify-tag \
            --title "wclip $GITHUB_REF_NAME" --generate-notes \
            wclip-linux-x64 wclip-linux-x64-baseline wclip-linux-arm64 \
            wclip-node.js wclip-bun.js SHA256SUMS
